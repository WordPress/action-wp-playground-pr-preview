<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">WordPress Playground PR Preview</a>
    <nav aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}">README</a>
      <a href="{{ '/migration/' | relative_url }}">Migration guide</a>
      <a href="{{ '/v2/' | relative_url }}">v2 docs</a>
      <a href="https://github.com/WordPress/action-wp-playground-pr-preview">GitHub</a>
    </nav>
  </header>
  <main class="page">
    {{ content }}
  </main>
</body>
</html>
