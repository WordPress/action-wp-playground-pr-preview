name: WordPress Playground Preview - Publish (reusable)

# Reusable workflow that publishes a built artifact bundle from
# `preview-build.yml` to a public release and posts the Preview button.
#
# MUST be invoked from a `workflow_run` trigger so it can run with
# `contents: write` + `pull-requests: write` even when the originating PR
# came from a fork. Any other trigger is rejected at runtime.

on:
  workflow_call:
    inputs:
      blueprint:
        description: |
          Blueprint JSON template. May contain `{{ARTIFACT_URL:<name>}}`
          placeholders that will be replaced with public URLs of the matching
          zips from the build artifact bundle. Mutually exclusive with `kind`
          and `blueprint-from-artifact`.
        required: false
        type: string
        default: ''
      kind:
        description: |
          Shortcut for the common single-zip case: `plugin` or `theme`. When
          set, exactly one zip is required in the artifact bundle and a
          default install+activate blueprint is generated. Mutually exclusive
          with `blueprint` and `blueprint-from-artifact`.
        required: false
        type: string
        default: ''
      blueprint-from-artifact:
        description: |
          When `true`, read the blueprint template from `blueprint.json`
          inside the build artifact bundle. Use this with
          `preview-build.yml`'s `blueprint-from-build:` input when the
          blueprint must vary per PR. Mutually exclusive with `blueprint`
          and `kind`.
        required: false
        type: boolean
        default: false
      artifacts-to-keep:
        description: 'How many recent artifact sets to keep per PR.'
        required: false
        type: string
        default: '2'
      release-tag:
        description: 'Release tag used to host artifacts publicly.'
        required: false
        type: string
        default: 'ci-artifacts'
      mode:
        description: '`append-to-description` or `comment`.'
        required: false
        type: string
        default: 'append-to-description'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against misuse
        # This workflow is privileged. It may only run after an unprivileged
        # pull_request build completed. Do not convert this to a job-level
        # `if`: misconfigured callers should see a loud failure, not a
        # silently skipped publish job.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "::error::preview-publish.yml must be invoked from a workflow_run trigger." >&2
            exit 1
          fi
          if [ "$WORKFLOW_RUN_EVENT" != "pull_request" ]; then
            echo "Source workflow was not a pull_request ($WORKFLOW_RUN_EVENT); skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
            echo "Source workflow did not succeed ($WORKFLOW_RUN_CONCLUSION); skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

      - name: Validate inputs
        if: env.SKIP != '1'
        shell: bash
        env:
          BLUEPRINT: ${{ inputs.blueprint }}
          KIND: ${{ inputs.kind }}
          FROM_ARTIFACT: ${{ inputs.blueprint-from-artifact }}
          ARTIFACTS_TO_KEEP: ${{ inputs.artifacts-to-keep }}
        run: |
          set -euo pipefail
          set_count=0
          [ -n "$BLUEPRINT" ] && set_count=$((set_count + 1))
          [ -n "$KIND" ] && set_count=$((set_count + 1))
          [ "$FROM_ARTIFACT" = "true" ] && set_count=$((set_count + 1))
          if [ "$set_count" -ne 1 ]; then
            echo "::error::Provide exactly one of: blueprint, kind, blueprint-from-artifact." >&2
            exit 1
          fi
          if [ -n "$KIND" ] && [ "$KIND" != "plugin" ] && [ "$KIND" != "theme" ]; then
            echo "::error::kind must be 'plugin' or 'theme', got: $KIND" >&2
            exit 1
          fi
          if [ "$ARTIFACTS_TO_KEEP" != "keep-all" ]; then
            if ! [[ "$ARTIFACTS_TO_KEEP" =~ ^[0-9]+$ ]] || [ "$ARTIFACTS_TO_KEEP" -lt 1 ]; then
              echo "::error::artifacts-to-keep must be a positive integer or 'keep-all', got: $ARTIFACTS_TO_KEEP" >&2
              exit 1
            fi
          fi

      - name: Identify artifact bundle
        id: meta
        if: env.SKIP != '1'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            const list = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const artifacts = list.data.artifacts.filter(x =>
              /^wp-playground-preview-pr\d+-[0-9a-f]+$/i.test(x.name)
            );
            if (artifacts.length === 0) {
              throw new Error('No wp-playground-preview-pr* bundle found in source run.');
            }
            if (artifacts.length !== 1) {
              throw new Error(`Expected exactly one wp-playground-preview-pr* bundle, found ${artifacts.length}: ${artifacts.map(a => a.name).join(', ')}`);
            }
            const a = artifacts[0];
            const m = a.name.match(/^wp-playground-preview-pr(\d+)-(.+)$/);
            if (!m) throw new Error(`Cannot parse artifact name: ${a.name}`);
            const [, rawPrNumber, commitSha] = m;
            const prNumber = Number(rawPrNumber);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
              throw new Error('Artifact PR number must be a positive safe integer.');
            }
            const expectedSha = context.payload.workflow_run.head_sha;
            if (commitSha !== expectedSha) {
              throw new Error(`Artifact SHA ${commitSha} does not match source workflow_run.head_sha ${expectedSha}.`);
            }
            // `workflow_run.pull_requests` can be empty for fork PRs. The artifact
            // name carries the PR number, so verify it by reading that PR from
            // the base repository and matching its current head SHA to the
            // workflow_run head SHA before using any artifact bytes.
            const prResponse = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (prResponse.data.head.sha !== expectedSha) {
              throw new Error(`Artifact PR number ${prNumber} points to head SHA ${prResponse.data.head.sha}, not workflow_run.head_sha ${expectedSha}.`);
            }
            core.setOutput('artifact-id', String(a.id));
            core.setOutput('artifact-name', a.name);
            core.setOutput('pr-number', String(prNumber));
            core.setOutput('commit-sha', commitSha);

      - name: Download artifact bundle
        if: env.SKIP != '1'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.meta.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > bundle.zip

      - name: Extract artifact bundle
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle
          python3 <<'PY'
          import stat
          from pathlib import Path
          from zipfile import ZipFile

          root = Path('bundle').resolve()

          with ZipFile('bundle.zip') as archive:
              # Check the complete archive before writing any of its contents.
              for entry in archive.infolist():
                  destination = (root / entry.filename).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f'Invalid bundle path: {entry.filename!r}')

                  mode = entry.external_attr >> 16
                  file_type = stat.S_IFMT(mode)
                  expected_type = stat.S_IFDIR if entry.is_dir() else stat.S_IFREG
                  if entry.create_system == 3 and file_type not in (0, expected_type):
                      raise SystemExit(f'Bundle entry must be a regular file or directory: {entry.filename!r}')

              archive.extractall(root)
          PY
          ls -R bundle

      - name: Prepare release assets
        if: env.SKIP != '1'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit-sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf release-assets
          mkdir release-assets
          manifest="$RUNNER_TEMP/release-assets.tsv"
          : > "$manifest"
          for src in bundle/zips/*.zip; do
            if [ ! -f "$src" ] || [ -L "$src" ]; then
              echo "::error::Bundle artifact must be a regular file: $src" >&2
              exit 1
            fi
            name="$(basename "$src" .zip)"
            if [[ ! "$name" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Invalid artifact name '$name' (allowed: A-Za-z0-9_-)" >&2
              exit 1
            fi
            asset="pr-${PR_NUMBER}-${COMMIT_SHA}-${name}.zip"
            cp -- "$src" "release-assets/$asset"
            printf '%s\t%s\n' "$name" "$asset" >> "$manifest"
          done
          echo "RELEASE_ASSET_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Ensure release exists
        if: env.SKIP != '1'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exit 0
          fi
          # Prerelease (not draft): download URLs are public, so the preview
          # button works on first run without a manual publish step.
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --notes "Automated prerelease for WordPress Playground CI artifacts"

      - name: Upload zips and resolve URLs
        id: urls
        if: env.SKIP != '1'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapping_file="$RUNNER_TEMP/artifact-urls.json"
          echo '{}' > "$mapping_file"
          while IFS=$'\t' read -r name asset; do
            [ -n "$name" ] || continue
            staged="release-assets/$asset"
            if [ ! -f "$staged" ] || [ -L "$staged" ]; then
              echo "::error::Prepared release asset must be a regular file: $staged" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$staged" --repo "$GITHUB_REPOSITORY" --clobber
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
            node -e '
              const fs = require("fs");
              const f = process.argv[1], k = process.argv[2], v = process.argv[3];
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j[k] = v;
              fs.writeFileSync(f, JSON.stringify(j));
            ' "$mapping_file" "$name" "$url"
            echo "Exposed: $name -> $url"
          done < "$RELEASE_ASSET_MANIFEST"
          echo "mapping-file=$mapping_file" >> "$GITHUB_OUTPUT"
          echo "first-name=$(node -e 'const j=require(process.argv[1]);console.log(Object.keys(j)[0]||"")' "$mapping_file")" >> "$GITHUB_OUTPUT"
          echo "count=$(node -e 'console.log(Object.keys(require(process.argv[1])).length)' "$mapping_file")" >> "$GITHUB_OUTPUT"

      - name: Render blueprint
        id: blueprint
        if: env.SKIP != '1'
        shell: bash
        env:
          BLUEPRINT_INPUT: ${{ inputs.blueprint }}
          KIND: ${{ inputs.kind }}
          FROM_ARTIFACT: ${{ inputs.blueprint-from-artifact }}
          MAPPING_FILE: ${{ steps.urls.outputs.mapping-file }}
          FIRST_NAME: ${{ steps.urls.outputs.first-name }}
          COUNT: ${{ steps.urls.outputs.count }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
            const fs = require('fs');
            const urls = JSON.parse(fs.readFileSync(process.env.MAPPING_FILE, 'utf8'));

            // Placeholders always live inside a JSON string context
            // ("url": "{{ARTIFACT_URL:foo}}"), so emit the URL as
            // JSON.stringify minus the outer quotes — that gives proper
            // escaping for ", \, and control chars without changing the
            // caller-side `"{{...}}"` convention.
            const substitute = (template) =>
              template.replace(/\{\{\s*ARTIFACT_URL:([a-zA-Z0-9_-]+)\s*\}\}/g, (_, name) => {
                if (!(name in urls)) {
                  throw new Error(`Blueprint references unknown artifact: ${name}. Available: ${Object.keys(urls).join(', ') || '(none)'}`);
                }
                return JSON.stringify(urls[name]).slice(1, -1);
              });

            let blueprint;
            if (process.env.FROM_ARTIFACT === 'true') {
              const bp = 'bundle/blueprint.json';
              if (!fs.existsSync(bp)) {
                throw new Error('blueprint-from-artifact: true but bundle/blueprint.json was not in the artifact.');
              }
              blueprint = substitute(fs.readFileSync(bp, 'utf8'));
            } else if (process.env.BLUEPRINT_INPUT) {
              blueprint = substitute(process.env.BLUEPRINT_INPUT);
            } else {
              const kind = process.env.KIND;
              const count = Number(process.env.COUNT || 0);
              if (count !== 1) {
                throw new Error(`kind shortcut requires exactly one artifact, found ${count}. Use blueprint: or blueprint-from-artifact: for multi-zip setups.`);
              }
              const name = process.env.FIRST_NAME;
              const step = kind === 'theme' ? 'installTheme' : 'installPlugin';
              const dataKey = kind === 'theme' ? 'themeZipFile' : 'pluginZipFile';
              blueprint = JSON.stringify({
                $schema: 'https://playground.wordpress.net/blueprint-schema.json',
                steps: [{
                  step,
                  [dataKey]: { resource: 'url', url: urls[name] },
                  options: { activate: true },
                }],
              });
            }

            // Validate parseability before handing off.
            JSON.parse(blueprint);
            // Single-line for safe `>>` into $GITHUB_OUTPUT.
            console.log('blueprint=' + JSON.stringify(JSON.parse(blueprint)));
          NODE

      - name: Cleanup old artifacts
        if: env.SKIP != '1'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          PR_NUMBER: ${{ steps.meta.outputs.pr-number }}
          ARTIFACTS_TO_KEEP: ${{ inputs.artifacts-to-keep }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$ARTIFACTS_TO_KEEP" = "keep-all" ]; then exit 0; fi
          # Group assets by SHA so each PR keeps N most recent commit sets,
          # not N individual zips (a single commit may upload several zips).
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name | startswith(\"pr-$PR_NUMBER-\")) | \"\(.createdAt)|\(.name)\"" \
            > pr-assets.txt || true
          [ -s pr-assets.txt ] || exit 0

          # Extract the SHA segment (pr-<N>-<SHA>-<rest>.zip) and find the
          # most-recent ARTIFACTS_TO_KEEP distinct SHAs. Anything else gets pruned.
          sort -r pr-assets.txt | awk -F'|' -v keep="$ARTIFACTS_TO_KEEP" '
            {
              name=$2;
              # pr-<n>-<sha>-... → split on "-", take field 3
              n=split(name, p, "-");
              sha=p[3];
              if (!(sha in seen)) { seen[sha]=++distinct }
              if (seen[sha] > keep) print name;
            }
          ' > to-delete.txt
          delete_errors=0
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            if ! gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes; then
              echo "::error::Failed to delete release asset: $asset" >&2
              delete_errors=1
            fi
          done < to-delete.txt
          if [ "$delete_errors" -ne 0 ]; then
            exit 1
          fi

      - name: Post Playground preview button
        if: env.SKIP != '1'
        uses: WordPress/action-wp-playground-pr-preview@6a92c0ffc2cdddc4368a807ed79b696aa58eed3e
        with:
          mode: ${{ inputs.mode }}
          blueprint: ${{ steps.blueprint.outputs.blueprint }}
          pr-number: ${{ steps.meta.outputs.pr-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
