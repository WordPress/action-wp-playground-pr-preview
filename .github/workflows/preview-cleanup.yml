name: WordPress Playground Preview - Cleanup (reusable)

# Reusable workflow that removes all release assets associated with a
# pull request from the ci-artifacts release. Call this from a workflow
# triggered by `pull_request: types: [closed]` to automatically clean up
# artifact zips when a PR is merged or closed.
#
# Example caller workflow:
#
#   on:
#     pull_request:
#       types: [closed]
#
#   jobs:
#     cleanup:
#       permissions:
#         contents: write
#       uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-cleanup.yml@v3
#       with:
#         pr-number: ${{ github.event.pull_request.number }}

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number whose release assets should be deleted.'
        required: true
        type: string
      release-tag:
        description: 'Release tag used to host artifacts publicly.'
        required: false
        type: string
        default: 'ci-artifacts'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release assets for closed PR
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr-number }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found; nothing to clean up."
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name | startswith(\"pr-$PR_NUMBER-\")) | .name" \
            > pr-assets.txt || true
          if [ ! -s pr-assets.txt ]; then
            echo "No release assets found for PR #$PR_NUMBER."
            exit 0
          fi
          delete_errors=0
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting release asset: $asset"
            if ! gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes; then
              echo "::error::Failed to delete release asset: $asset" >&2
              delete_errors=1
            fi
          done < pr-assets.txt
          if [ "$delete_errors" -ne 0 ]; then
            exit 1
          fi
          echo "Cleanup complete for PR #$PR_NUMBER."
